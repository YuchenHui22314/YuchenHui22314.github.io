{{- /* Menu for narrow cards; site.js shows it when the link row would cross the diagonal. */ -}}
<template id="drawer-tpl">
  <div class="drawer">
    <div class="panel" role="dialog" aria-modal="true" aria-label="{{ T "menu" }}">
      <div class="head"><span class="seal-mark" aria-hidden="true">惠</span><button type="button" class="icon-btn" data-close aria-label="{{ T "close" }}">✕</button></div>
      <a class="it" href="{{ site.Home.RelPermalink }}"><b>{{ T "home" }}</b><span>{{ T "hero_sub1" }}</span></a>
      {{- range site.Menus.main }}
      <a class="it" href="{{ .URL }}"><b>{{ with .Page }}{{ .Title }}{{ else }}{{ .Name }}{{ end }}</b>{{ with .Page }}{{ with .Description }}<span>{{ . }}</span>{{ end }}{{ end }}</a>
      {{- end }}
      {{ partial "deco/compass.html" (dict "class" "" "style" "width:120px;margin:26px auto 0;color:var(--muted);opacity:.4") }}
    </div>
  </div>
</template>
