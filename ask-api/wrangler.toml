name = "ask-api"
main = "src/index.js"
compatibility_date = "2026-04-01"
# Served at https://ask-api.xiyuchen.workers.dev only; no per-version preview addresses.
workers_dev = true
preview_urls = false

# The site's own address for the API: *.workers.dev is blocked in mainland China.
# xiyuchen.com's DNS is on Cloudflare since 2026-11-09.
routes = [{ pattern = "ask.xiyuchen.com", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://xiyuchen.com,https://www.xiyuchen.com,http://localhost:1313,http://127.0.0.1:1313"
# Optional, used as the click-through link in owner notifications.
ADMIN_PAGE_URL = "https://xiyuchen.com/ask/admin/"
# New questions and follow-ups are emailed from MAIL_FROM to MAIL_TO. Needs Email Routing
# on for xiyuchen.com and MAIL_TO verified there as a destination address.
MAIL_FROM = "askbox@xiyuchen.com"
MAIL_TO = "yuchen.hui@umontreal.ca"

[[send_email]]
name = "MAILER"
destination_address = "yuchen.hui@umontreal.ca"

[[d1_databases]]
binding = "DB"
database_name = "askbox"
# Created with `npx wrangler d1 create askbox` (2026-11-09, region ENAM). Local dev ignores it.
database_id = "55953d40-8c7b-43e5-87a9-3fd274a29b26"
migrations_dir = "migrations"
