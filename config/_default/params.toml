# Three colourways, each with a day and a night version. The first is the default; the
# switch in the navigation steps through them in this order and the browser remembers
# the choice. ?palette=green|brown|blue forces one.
palettes = ["brown", "green", "blue"]

# Montréal, shown in the corner of the home page.
coordinates = { lat = "45°30′", lon = "73°34′" }

# Character art on the home page, per colourway: files in assets/img/figures/.
# slot "a" stands where the diagonal meets the top edge, "b" where it meets the bottom,
# "center" in the middle of the diagonal. Missing files are simply skipped.
[figures]
credit = { name = "bj1034", url = "https://www.pixiv.net/en/users/5963996" }
[[figures.green]]
slot = "a"
file = "green-conan.webp"
who = "conan"
[[figures.green]]
slot = "b"
file = "green-haibara.webp"
who = "haibara"
[[figures.brown]]
slot = "a"
file = "brown-conan.webp"
who = "conan"
[[figures.brown]]
slot = "b"
file = "brown-haibara.webp"
who = "haibara"
[[figures.blue]]
slot = "center"
file = "blue-kid-conan.webp"
who = "kid_conan"

# Q&A box (提问箱). The API lives in ask-api/; see ask-api/README.md for deployment.
# Leave `api` empty until the Worker is deployed: the page then says the box is not open yet.
# config/development/params.toml points it at the local Worker for `hugo server`.
[askbox]
api = ""
turnstileSiteKey = ""
