baseURL = "https://xiyuchen.com/"

# English lives at the site root, Chinese under /zh/, French under /fr/.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Makes .Summary and .WordCount behave correctly for Chinese text.
hasCJKLanguage = true

enableRobotsTXT = true
# Tags are shown on posts but get no pages of their own.
disableKinds = ["taxonomy", "term"]

# Top-level keys must stay above this line: in TOML, everything after a [table] header belongs to that table.

[outputs]
home = ["html", "rss", "searchindex"]
section = ["html", "rss"]

[outputFormats.searchindex]
mediaType = "application/json"
baseName = "search"
isPlainText = true
notAlternative = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.8

[taxonomies]
tag = "tags"

[imaging]
quality = 82
resampleFilter = "Lanczos"
