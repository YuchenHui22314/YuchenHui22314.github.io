baseURL = "https://xiyuchen.com/"

# English lives at the site root, Chinese under /zh/, French under /fr/.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Makes .Summary and .WordCount behave correctly for Chinese text.
hasCJKLanguage = true

disqusShortname = "none"
enableRobotsTXT = true

# Top-level keys must stay above this line: in TOML, everything after a [table] header belongs to that table.

[pagination]
pagerSize = 5

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.8

[taxonomies]
tag = "tags"
