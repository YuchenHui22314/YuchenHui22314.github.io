[goldmark.renderer]
unsafe = true

# A picture on its own line becomes a <figure> (layouts/_markup/render-image.html), not <p><img></p>.
[goldmark.parser]
wrapStandAloneImageWithinParagraph = false

[goldmark.parser.attribute]
block = true

[goldmark.extensions.passthrough]
enable = true

# LaTeX math support
[goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]

[tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[highlight]
noClasses = false
codeFences = true
guessSyntax = true
